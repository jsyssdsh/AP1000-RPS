name: ap1000-rps
services:
  rps:
    build: .
    image: ap1000-rps:local
    ports:
      - "127.0.0.1:${PORT:-8080}:8000"
    environment:
      DB_PATH: /app/data/rps.db
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-openrouter/openai/gpt-oss-120b}
    volumes:
      - rps-data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  rps-data:

name: ap1000-rps-test
services:
  app:
    build: .
    image: ap1000-rps:local
    environment:
      DB_PATH: /tmp/rps-test.db
      OPENROUTER_API_KEY: ""
    tmpfs:
      - /tmp
  playwright:
    image: mcr.microsoft.com/playwright:v1.58.2-noble
    depends_on:
      app:
        condition: service_healthy
    environment:
      BASE_URL: http://app:8000
    working_dir: /work/test
    volumes:
      - .:/work
      - playwright-deps:/work/test/node_modules
    command: sh -c "npm ci && npx playwright test"
volumes:
  playwright-deps:
